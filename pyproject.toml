[project]
name = "bmieeg"
version = "0.1.0"
description = ""
authors = [
    {name = "martiiiina",email = "martina.baroffio@epfl.ch"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch (>=2.14.1,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pyedflib (>=0.1.42,<0.2.0)",
    "mne (>=1.13.2,<2.0.0)",
    "mne-icalabel (>=0.10.0,<0.11.0)",
    "onnxruntime (>=1.31.0,<2.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "pyxdf (>=1.17.5,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "docformatter (>=1.7.8,<2.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "pylint (>=4.1.3,<5.0.0)"
]
